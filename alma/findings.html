<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Findings – Alma</title><link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body>
<nav class="top"><a class="logo" href="index.html"><span id="mk"></span>Alma</a><div class="l"><a class="btn o sm" href="index.html">Home</a></div></nav>
<div class="doc" style="max-width:860px"><h1>Findings</h1><p class="hint" id="src">Loading…</p><div id="rq"></div></div>
<div id="modal"></div><script src="js/config.js"></script><script src="js/store.js"></script><script src="js/live.js"></script>
<script>
$("#mk").innerHTML=MARK;
const t=(rows)=>`<table>${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table>`,n=(v,u="")=>v==null?"–":v+u;
Quick.findings().then(s=>{
 const live=!!s,a=s&&s.ai.test,b=s&&s.bench,bl=b&&b.legacy;
 $("#src").textContent=live?"Numbers below are read from the running system.":"Connect Alma to its server to see live numbers. The answers below describe the design.";
 const Q=[
 ["How can a smart-contract-driven access model stop unauthorised certificate issuance?",
  "Roles live in the contract, not in the web page or the server. The platform owner gives an institution the Institution role and then approves it. The issue function refuses any wallet that does not hold that role and approval. Only the issuing institution can revoke its own record. Only regulators can hold or release a record. Each institution signs with its own wallet, so one institution cannot issue or revoke for another. The server checks the same table first, so a refused request gets a clear message, and every refused request is logged.",
  live?t([["Blocked attempts logged",n(s.denied)],["Contract",'<span class="mono">'+s.chain.contract+"</span>"],["Network",s.chain.mode+" · chain "+s.chain.id]]):""],
 ["How is the AI model trained and used to catch fraud in real time?",
  "An isolation forest scores every issuance before it is accepted. It looks at the hour, the gap since the last record, how many records arrived in the last hour and day, whether the same student and title already exist, and how many actions were blocked recently. It starts from normal patterns and learns each institution's own history from the ledger, and it can be retrained at any time. A record that scores above the cut-off is held on the chain until a regulator releases it. Separate rules watch administrator behaviour, such as many blocked actions, mass revocation or a burst of new API keys, and raise an alert.",
  live?t([["Test set",a.normal+" normal and "+a.anomalies+" unusual cases the model had not seen"],["Precision",a.precision],["Recall",a.recall],["AUC",a.auc],["False alarms",(a.falsePositiveRate*100).toFixed(1)+"%"],["Cut-off",s.ai.threshold+" / 100"]])+'<p class="hint" style="margin:8px 0 0">The test uses simulated fraud patterns plus the ledger. Retrain on real data once institutions are live.</p>':""],
 ["How does IPFS storage with hashing protect records from server failure and tampering?",
  "A record's details are encrypted, then stored as an IPFS block. Its address (CID) is a hash of the stored bytes, so any change gives a different address. Copies are pinned on several nodes. If one node fails, reads continue from another. If a copy is damaged, the check spots that its hash no longer matches, skips it and repairs it from a good copy. Only the fingerprint and the address go on the blockchain.",
  live?t([["Storage nodes up",s.storage.up+" of "+s.storage.nodes+" ("+(s.storage.kind==="kubo"?"IPFS":"local blocks")+")"],["Records stored",s.records]]):""],
 ["How do we keep verification immutable and still follow data protection law?",
  "Two stores with two jobs. The blockchain holds only non-personal facts (fingerprint, storage address, status) and cannot be edited. Personal details sit in encrypted storage where they can be shared selectively, exported or erased. Erasing removes every copy and marks the chain entry as erased, so the right to erasure is met without touching the chain. The audit log is hash-chained and its head is anchored on the blockchain, so rewriting history is detectable. Consent is recorded when an account is created, details are shared only by the owner, and every check is visible to the owner.",
  live?t([["Audit log blocks",s.ledgerBlocks],["Anchors on the chain",s.chain.anchors],["Terms version",s.terms]]):""],
 ["How does the hybrid design perform on latency, scale and cost against a paper registry?",
  "Checking a record is one read of the chain plus one read from storage, so it takes milliseconds. Issuing is one chain transaction, so its time is set by the network's block time and its cost by gas. Reads do not slow down as the ledger grows.",
  live&&b?t([["Chain mode",b.mode==="local"?"local test chain (public networks add block time, often 2 to 15 seconds)":"external network"],["Check a record (chain read plus storage read)",n(b.verifyEndToEndMs," ms")],["Chain reads per second",n(b.lookupsPerSec)],["Store and read on IPFS",n(b.ipfsPinMs," ms")+" / "+n(b.ipfsFetchMs," ms")],["Issue transaction",n(b.txConfirmMs," ms")+", "+b.issueGas+" gas"],["Cost to issue","$"+b.issueCostUsd+" (assumes "+b.assumptions.gasPriceGwei+" gwei, $"+b.assumptions.nativeUsd+" per coin)"],["Paper registry check",bl.days+" days, $"+bl.feeUsd+" (assumed typical)"],["Audit log check",b.ledgerScale.map(x=>x.blocks+" blocks: "+x.ms+" ms").join(" · ")]])+'<p class="hint" style="margin:8px 0 0">Measured on this running system. The owner can re-run it from the Performance tab.</p>':(live?'<p class="hint">No benchmark has been run yet. Open Performance as the owner and run it.</p>':"")]];
 $("#rq").innerHTML=Q.map((q,i)=>`<div class="rq"><p class="q">${i+1}. ${q[0]}</p><p class="a">${q[1]}</p>${q[2]?`<div class="ev">${q[2]}</div>`:""}</div>`).join("");
});
</script></body></html>
