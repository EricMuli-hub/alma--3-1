<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Alma</title><link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body>
<div id="toast" role="status"></div>

<nav class="top"><span class="logo"><span id="mk"></span>Alma</span></nav>
<div class="w" style="max-width:460px;padding-top:30px"><h1 style="font-size:32px">Owner access</h1><form id="f" novalidate><label for="em">Email</label><input id="em" type="email" autocomplete="username"><div id="pwz"></div><label for="ky">Owner key</label><input id="ky" type="password" autocomplete="off"><div class="err" id="er" role="alert"></div><button class="btn" style="width:100%">Enter</button></form></div>

<div id="modal"></div><button class="mailfab noprint" data-mail>Demo mailbox</button>
<script src="js/config.js"></script><script src="js/store.js"></script><script src="js/live.js"></script><script>
Store.ready.then(()=>{$("#mk").innerHTML=MARK;$("#pwz").innerHTML=pwf("pw","Password","current-password");if(Live.on()){$("label[for=ky]").textContent="Two-step code (only if turned on)";$("#ky").type="text";$("#ky").setAttribute("inputmode","numeric");$("#ky").autocomplete="one-time-code"}
$("#f").onsubmit=Live.on()?Live.ownerSubmit:e=>{e.preventDefault();const d=Store.d,u=d.users.find(x=>x.role==="owner"&&x.email===$("#em").value.trim().toLowerCase());
 if(!u||u.pw!==$("#pw").value||u.key!==$("#ky").value.trim())return $("#er").textContent="Those details were not recognised.";d.session=u.email;Store.save();go("/app")}})</script></body></html>
