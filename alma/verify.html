<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Check a record – Alma</title><link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body>
<div id="toast" role="status"></div>
<nav class="top"><a class="logo" href="index.html"><span id="mk"></span>Alma</a><div class="l"><a class="btn o sm" href="auth.html?role=employer&mode=signin">Sign in as verifier</a></div></nav>
<div class="doc"><h1>Check a record</h1><div class="qc"><label for="qh" class="hint">Record fingerprint</label><input id="qh" autocomplete="off"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="qb" style="flex:1;margin:0">Check</button><button class="btn o" id="qs">Scan</button></div><div id="qr" style="margin-top:12px"></div></div>
<p class="hint" style="margin-top:14px">This check shows only whether the record is genuine. To see details, the owner must share them with your verifier account.</p></div>
<div id="modal"></div><script src="js/config.js"></script><script src="js/store.js"></script><script src="js/scan.js"></script><script src="js/live.js"></script>
<script>$("#mk").innerHTML=MARK;Quick.wire($("#qh"),$("#qb"),$("#qr"));$("#qs").onclick=()=>Scan.open(h=>{$("#qh").value=h;$("#qb").click()});if(CONFIG.MODE==="demo")$("#qs").remove();const h=qp().get("h");if(h){$("#qh").value=h;$("#qb").click()}</script></body></html>
